<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache & Refresh</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .info {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            color: #4c1d95;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Clear Cache & Refresh</h1>
        <p>Click the button below to clear your cached role data and reload the page.</p>
        
        <button class="btn" onclick="clearAndRefresh()">
            Clear Cache & Refresh
        </button>
        
        <div class="status" id="status">
            ✅ Cache cleared! Redirecting to dashboard...
        </div>
        
        <div class="info">
            <strong>What this does:</strong><br>
            Clears your cached organization data and forces the app to fetch fresh data from the server with your updated role.
        </div>
    </div>
    
    <script>
        function clearAndRefresh() {
            // Clear the cached organization data
            localStorage.removeItem('organizations');
            localStorage.removeItem('selectedOrganization');
            
            // Show success message
            document.getElementById('status').classList.add('success');
            
            // Redirect to home page after 1 second
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        }
    </script>
</body>
</html>
